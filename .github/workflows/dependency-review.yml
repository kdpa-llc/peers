name: Dependency Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review Dependencies
    # Dependency review needs the dependency graph, which on a private repository requires
    # GitHub Advanced Security — without it the action hard-fails ("Dependency review is not
    # supported on this repository") rather than degrading. Skipping while private keeps the
    # check honest instead of permanently red, and it starts working on its own the moment
    # this repository is made public, where the dependency graph is free.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always
