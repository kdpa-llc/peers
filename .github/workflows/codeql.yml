name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'
  # Manual trigger. Without it, a weekly-only job takes a week to prove either way that the
  # scan still works — a lesson already learned in a sibling repo, where CodeQL silently
  # produced no analysis for months.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    # CodeQL analyses fine on a private repository — it builds the database and runs the
    # queries — but the upload fails with "Code Security must be enabled for this repository
    # to use code scanning", because code scanning needs GitHub Advanced Security while
    # private. Skipping there keeps the check honest rather than permanently red; it starts
    # working on its own once this repository is public, where code scanning is free.
    #
    # `== false` rather than `!private` on purpose: events whose payload carries no
    # repository object then skip instead of running and failing.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # There is no build: the project runs from source through type stripping.
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
