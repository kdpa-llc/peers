# Publishes to npm when a version tag (v1.2.3) is pushed, using npm trusted publishing
# (OIDC): no npm token is stored in this repository, and every release carries provenance.
#
#   npm version patch   # bumps package.json and creates the tag
#   git push --follow-tags
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  publish:
    name: publish to npm
    if: github.repository == 'kdpa-llc/peers'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the GitHub release
      id-token: write   # npm trusted publishing and provenance

    steps:
      - uses: actions/checkout@v7

      # Trusted publishing needs npm >= 11.5.1; Node 24 ships it.
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Check the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json ($version)"
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:package

      - name: Publish
        run: npm publish --provenance --access public

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
