<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense log</title>
  <link rel="stylesheet" href="expenses.css">
  <script src="_peers/peers.js"></script>
</head>
<body>
  <h1>Expense log</h1>
  <form id="add">
    <input name="date" type="date" required aria-label="Date">
    <input name="amount" type="number" step="0.01" min="0" placeholder="Amount" required aria-label="Amount">
    <input name="category" placeholder="Category" aria-label="Category">
    <input name="note" placeholder="Note" aria-label="Note">
    <button type="submit">Add</button>
  </form>
  <p id="status"></p>
  <section id="totals"></section>
  <table>
    <thead><tr><th>Date</th><th>Amount</th><th>Category</th><th>Note</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <script type="module" src="expenses.js"></script>
</body>
</html>
